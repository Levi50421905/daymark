<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daymark — Membuka halaman…</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(130deg, #eaf7ff 0%, #e3f8f4 48%, #f1edff 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #0b2137;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; text-align: center; }
      .mark {
        width: 58px; height: 58px; border-radius: 17px;
        background: linear-gradient(135deg, #56b7ff, #2cc6c9 55%, #67ddbd);
        display: grid; place-items: center;
        box-shadow: 0 24px 50px -24px rgba(15, 169, 184, 0.7);
      }
      .mark svg { display: block; }
      h1 { margin: 4px 0 0; font-size: 18px; letter-spacing: -0.03em; }
      p { margin: 0; max-width: 280px; color: #607992; font-size: 12px; line-height: 1.6; }
      a { margin-top: 6px; color: #0fa9b8; font-size: 12px; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #071321; color: #eef7ff; }
        p { color: #9ab0c5; }
        a { color: #3ad0d8; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
          <path d="M16 40.5h32" stroke="white" stroke-width="3.3" stroke-linecap="round" opacity=".96" />
          <path d="M25 36.2a7 7 0 0 1 14 0" stroke="white" stroke-width="3.3" stroke-linecap="round" opacity=".96" />
          <circle cx="32" cy="20.5" r="2.7" fill="white" opacity=".96" />
        </svg>
      </span>
      <h1>Membuka Daymark…</h1>
      <p>Mengarahkan ke halaman yang kamu tuju.</p>
      <a href="./" id="fallback-link">Buka Overview</a>
    </main>
    <script>
      ;(function () {
        var path = window.location.pathname
        var parts = path.split('/').filter(Boolean)
        var base = '/'
        var knownBases = ['/daymark/', '/daymark-ar/']
        for (var i = 0; i < knownBases.length; i += 1) {
          if (path.indexOf(knownBases[i]) === 0) {
            base = knownBases[i]
            break
          }
        }
        if (base === '/' && /\.github\.io$/i.test(window.location.hostname) && parts.length > 0) {
          base = '/' + parts[0] + '/'
        }
        var target = path + window.location.search + window.location.hash
        if (base !== '/' && target.length > base.length - 1) {
          try {
            window.sessionStorage.setItem('daymark:spa-redirect', target.slice(base.length - 1))
            window.location.replace(base)
            return
          } catch (error) {
            // If storage is blocked, the fallback link below still works.
          }
        }
        var link = document.getElementById('fallback-link')
        if (link) link.href = base
      })()
    </script>
  </body>
</html>
